# Aeneas extraction configuration for libcrux-hmac (the recorded extraction).
#
# FVS reads only three keys from this file: aeneas.commit, crate.dir and aeneas_args.dest
# (aeneas_args.dest is the directory that holds translation.json; any subdir is not added).
# The rest mirrors .formalising/extract/hmac/spec-recorded.json and the Charon and Aeneas
# command lines of the recorded run, so a regeneration repeats it. Keep the two in step.
# Tuple of the recorded run: Charon 0.1.315, Lean v4.35.0, rust nightly-2026-09-17.

aeneas:
  # The executable and the Lake/Lean backend use the same release revision.
  mode: release
  commit: "5a392f4b80a4d0d05abc240eb2a7fa70622a9a35" # release nightly-2026.11.09-5a392f4, as in lake-manifest.json
  repo: "https://github.com/AeneasVerif/aeneas.git"

# Revision of the extraction input that the recorded run used.
upstream:
  repo: "https://github.com/Beneficial-AI-Foundation/libcrux-verify"
  commit: "f19c23b013f5f431f94b33124a47dd39ac413608"

crate:
  dir: "crates/algorithms/hmac" # path to the Rust crate
  name: "libcrux_hmac" # crate name in the extraction (translation.json)

charon:
  preset: "aeneas"
  cargo_args: ["--locked", "--package", "libcrux-hmac", "--lib"]
  opaque:
    - "libcrux_sha2::hacl::sha256_update"
    - "libcrux_sha2::hacl::sha512_update"
    - "libcrux_hmac::incremental::hmac_slices"

aeneas_args:
  options:
    - emit-json # writes translation.json
  dest: "LibcruxHmac/Extraction" # output directory (holds LibcruxHmac.lean and translation.json)
